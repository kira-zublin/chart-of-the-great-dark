<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart of the Great Dark</title>
<meta name="description" content="Interactive Coriolis: The Great Dark star-chart prototype">
<style>
:root{--paper:#ded2ae;--gold:#cdb87d;--gold2:#8c794d;--rust:#a35f46;--ink:#080d12;--ink2:#0d151a;--muted:#978c72}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d12;color:var(--paper);font-family:Georgia,"Times New Roman",serif}
body{min-height:100vh}
#app{position:relative;width:100vw;height:100vh;overflow:hidden}
.stage{position:absolute;inset:0}
.chart{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background:
radial-gradient(circle at 71% 28%,rgba(121,48,35,.25),transparent 26%),
radial-gradient(circle at 23% 78%,rgba(53,82,101,.28),transparent 31%),
linear-gradient(180deg,#080d12,#0d151a 65%,#091015);isolation:isolate;cursor:grab;touch-action:none}
.chart.dragging{cursor:grabbing}
.chart:before{content:"";position:absolute;inset:-15%;z-index:0;pointer-events:none;background:
radial-gradient(ellipse at 27% 35%,rgba(198,105,68,.16),transparent 15%),
radial-gradient(ellipse at 65% 62%,rgba(82,112,132,.17),transparent 18%),
radial-gradient(ellipse at 52% 19%,rgba(210,177,102,.11),transparent 11%);filter:blur(15px);transform:rotate(-8deg)}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
svg.map{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.hud{position:absolute;z-index:3;left:20px;right:20px;top:18px;display:flex;justify-content:space-between;gap:12px;pointer-events:none}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(222,210,174,.62)}
.title{margin-top:3px;font-size:clamp(24px,3vw,42px);letter-spacing:.08em;color:#e4d8b8;text-shadow:0 1px #000}
.controls{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto}
button{min-height:40px;padding:8px 14px;border:1px solid rgba(205,184,125,.2);background:rgba(9,15,19,.68);color:#d9cba7;font:600 11px Georgia,serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
button:hover{border-color:rgba(205,184,125,.55)} button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.grid{stroke:rgba(205,184,125,.13);stroke-width:.75;fill:none}.const{stroke:rgba(205,184,125,.23);stroke-width:.8;fill:none}.orbit{stroke:rgba(205,184,125,.18);stroke-width:.8;fill:none;stroke-dasharray:2 5}
.route{stroke:rgba(205,184,125,.16);stroke-width:1;fill:none}.activeRoute{stroke:#d5bd80;stroke-width:1.5;fill:none;stroke-dasharray:7 7}.motion .activeRoute{animation:routeDash 2.8s linear infinite}@keyframes routeDash{to{stroke-dashoffset:-56}}
.system{cursor:pointer;outline:none}.system text{fill:rgba(226,215,184,.72);font-size:11px;letter-spacing:1.5px;paint-order:stroke;stroke:#091014;stroke-width:3px;stroke-linejoin:round}.system:hover text,.system.selected text,.system:focus text{fill:#f0e3bf}
.bloom{opacity:.22;filter:blur(3px);transform-box:fill-box;transform-origin:center;transition:.35s}.system:hover .bloom,.system.selected .bloom,.system:focus .bloom{opacity:.4;transform:scale(1.1)}
.line{fill:none;stroke:rgba(211,190,132,.58);stroke-width:1;transform-box:fill-box;transform-origin:center;transition:.3s}.line.faint{opacity:.46;stroke-dasharray:3 4}.line.bold{opacity:.92;stroke:rgba(230,207,148,.78)}.system.selected .line{stroke:#e0c98c;opacity:1}
.node{fill:#d6bf82;opacity:.9}.core{fill:#f0dd99;filter:url(#glow);transform-box:fill-box;transform-origin:center;transition:.25s}.starburst{fill:none;stroke:#eddba1;stroke-width:1;transform-box:fill-box;transform-origin:center;transition:.3s}.system:hover .core,.system.selected .core,.system:focus .core{transform:scale(1.2)}.system:hover .starburst,.system.selected .starburst,.system:focus .starburst{transform:scale(1.08)}
.motion .system:hover .spinA,.motion .system.selected .spinA,.motion .system:focus .spinA{animation:spin 14s linear infinite}.motion .system:hover .spinB,.motion .system.selected .spinB,.motion .system:focus .spinB{animation:spinBack 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinBack{to{transform:rotate(-360deg)}}
.motion .system:hover .floatA,.motion .system.selected .floatA{animation:floatA 3.7s ease-in-out infinite}.motion .system:hover .floatB,.motion .system.selected .floatB{animation:floatB 4.1s ease-in-out infinite}@keyframes floatA{50%{transform:translate(1px,-2px)}}@keyframes floatB{50%{transform:translate(-1px,2px)}}
.dossier{position:fixed;z-index:10;left:0;top:0;bottom:0;width:min(390px,90vw);min-width:0;overflow:auto;border-right:1px solid rgba(205,184,125,.32);background:linear-gradient(rgba(14,20,23,.975),rgba(14,20,23,.975)),radial-gradient(circle at 80% 8%,rgba(151,75,52,.28),transparent 30%);padding:68px 24px 28px;transform:translateX(-104%);opacity:0;transition:transform .46s cubic-bezier(.22,.8,.2,1),opacity .28s ease;box-shadow:12px 0 38px rgba(0,0,0,.28);pointer-events:none}
.dossier.open{transform:translateX(0);opacity:1;pointer-events:auto}
.dossier:before{content:"";position:absolute;left:24px;right:24px;top:54px;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.close-dossier{position:absolute;top:15px;left:18px;width:38px;height:38px;min-height:38px;padding:0;border:1px solid rgba(205,184,125,.27);border-radius:50%;font-size:19px;line-height:36px;letter-spacing:0;background:rgba(8,13,18,.72);color:#d9cba7}
.bird{position:absolute;right:18px;top:18px;width:58px;height:58px;opacity:.68}.motion .bird{animation:birdIdle 4.7s ease-in-out infinite}@keyframes birdIdle{50%{transform:translateY(-3px) rotate(-1.5deg)}}
.chapter{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#9f8d61;margin-bottom:18px}.dossier h2{max-width:76%;margin:0;font-size:30px;line-height:1.05;font-weight:500;color:#e3d4ae}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 17px}.chip{border:1px solid rgba(205,184,125,.26);padding:4px 7px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#bbae8a}.lede{font-size:14px;line-height:1.55;color:#c9bea4}.rule{display:flex;align-items:center;gap:8px;margin:18px 0 13px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#a8966d}.rule:before,.rule:after{content:"";height:1px;flex:1;background:rgba(205,184,125,.22)}dl{display:grid;grid-template-columns:88px 1fr;gap:9px 12px;margin:0}dt{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8f825f}dd{margin:0;font-size:13px;line-height:1.35;color:#c7bca2}.rumor{margin-top:18px;padding:14px 0 0 15px;border-left:1px solid rgba(205,184,125,.34);font-size:13px;line-height:1.45;font-style:italic;color:#ae9f80}.hint{position:absolute;left:16px;bottom:14px;z-index:4;max-width:82%;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:rgba(216,207,181,.5);pointer-events:none}.legend{position:fixed;z-index:5;right:18px;bottom:16px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px 16px;font-size:12px;color:var(--muted);pointer-events:none}.legend span{display:inline-flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:#cdb77d}.dot.red{background:#a35f46}.dot.blue{background:#718b9b}
@media(max-width:800px){.hud{left:14px;right:14px;top:12px;flex-direction:column}.controls{justify-content:flex-start}.title{font-size:25px}.dossier{width:min(360px,94vw)}.legend{left:14px;right:14px;justify-content:flex-start}.hint{bottom:48px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app">
<div class="stage">
<section class="chart" aria-label="Interactive Chart of the Great Dark prototype">
<canvas id="dust" aria-hidden="true"></canvas>
<div class="hud"><div><div class="eyebrow">Explorers Guild · Cartographic Instrument 07</div><div class="title">CHART OF THE GREAT DARK</div></div><div class="controls"><button id="reset" type="button">Reset chart</button></div></div>
<svg class="map" id="map" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Star chart with three selectable expedition prospects">
<defs><filter id="glow" x="-200%" y="-200%" width="400%" height="400%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<g>
<circle class="grid" cx="450" cy="320" r="245"/><circle class="grid" cx="450" cy="320" r="178"/><circle class="grid" cx="450" cy="320" r="112"/>
<path class="const" d="M72 487 Q240 148 450 320 T840 175"/><path class="const" d="M94 210 Q340 420 806 410"/><path class="const" d="M120 535 L756 122"/><path class="const" d="M161 96 L767 509"/>
<ellipse class="orbit" cx="450" cy="320" rx="330" ry="106" transform="rotate(-18 450 320)"/><ellipse class="orbit" cx="450" cy="320" rx="278" ry="72" transform="rotate(36 450 320)"/>
<path class="route" d="M205 372 C310 322 380 286 514 238"/><path class="route" d="M205 372 C330 382 510 404 676 350"/><path class="route" d="M205 372 C274 445 405 494 560 474"/><path id="activeRoute" class="activeRoute" d="M205 372 C310 322 380 286 514 238"/>
<g class="system" data-key="home" tabindex="0" role="button" aria-label="Jumuah" transform="translate(205 372)">
<circle class="bloom" r="20" fill="#5f8297"/><circle class="line faint spinA" r="20"/><circle class="line" r="11"/><path class="line" d="M-29 0H29 M0-29V29"/><path class="line faint" d="M-19-19L19 19 M19-19L-19 19"/><circle class="core" r="4"/><path class="starburst" d="M0-12L3-3L12 0L3 3L0 12L-3 3L-12 0L-3-3Z"/><text x="-8" y="-35">JUMUAH</text></g>
<g class="system" data-key="choir" tabindex="0" role="button" aria-label="The Choir Below" transform="translate(514 238)">
<ellipse class="bloom" rx="35" ry="24" fill="#bd724b" transform="rotate(-16)"/><ellipse class="bloom" rx="25" ry="18" fill="#d2a34e" transform="rotate(20)"/><circle class="line faint spinA" r="29"/><circle class="line spinB" r="20"/><path class="line bold" d="M-42 0H42"/><path class="line" d="M0-39V39"/><path class="line faint" d="M-29-29L29 29"/><path class="line faint" d="M-33 12C-12 1 12 1 33-12"/><path class="line faint" d="M-33-12C-12-1 12-1 33 12"/><circle class="node floatA" cx="0" cy="-29" r="2.3"/><circle class="node floatB" cx="20" cy="0" r="2"/><circle class="node floatA" cx="0" cy="29" r="2.3"/><circle class="node floatB" cx="-20" cy="0" r="2"/><circle class="core" r="4.7"/><path class="starburst" d="M0-14L3.2-3.2L14 0L3.2 3.2L0 14L-3.2 3.2L-14 0L-3.2-3.2Z"/><text x="19" y="-41">THE CHOIR BELOW</text></g>
<g class="system" data-key="feathers" tabindex="0" role="button" aria-label="Vault of Seven Feathers" transform="translate(676 350)">
<ellipse class="bloom" rx="32" ry="21" fill="#617e90" transform="rotate(10)"/><ellipse class="bloom" rx="23" ry="31" fill="#b89b56" transform="rotate(-17)"/><ellipse class="line faint spinA" rx="31" ry="16" transform="rotate(-14)"/><ellipse class="line spinB" rx="18" ry="27" transform="rotate(18)"/><path class="line bold" d="M0-40V40"/><path class="line" d="M-34 0H34"/><path class="line faint" d="M-10-32C-16-23-15-14-6-7"/><path class="line faint" d="M6-31C2-23 3-15 10-7"/><path class="line faint" d="M-24-19C-27-8-24 2-14 10"/><path class="line faint" d="M24-19C27-8 24 2 14 10"/><path class="line faint" d="M-22 18C-16 10-12 7-6 4"/><path class="line faint" d="M22 18C16 10 12 7 6 4"/><path class="line faint" d="M0 32C-3 22-3 16 0 8"/><circle class="node floatA" cx="0" cy="-31" r="2"/><circle class="node floatB" cx="-24" cy="-17" r="2"/><circle class="node floatA" cx="24" cy="-17" r="2"/><circle class="node floatB" cx="-22" cy="16" r="2"/><circle class="node floatA" cx="22" cy="16" r="2"/><circle class="node floatB" cx="0" cy="31" r="2"/><circle class="node" cx="0" cy="0" r="1.7"/><circle class="core" r="4.5"/><path class="starburst" d="M0-13L3-3L13 0L3 3L0 13L-3 3L-13 0L-3-3Z"/><text x="20" y="-37">VAULT OF SEVEN FEATHERS</text></g>
<g class="system" data-key="reliquary" tabindex="0" role="button" aria-label="Red Glass Reliquary" transform="translate(560 474)">
<ellipse class="bloom" rx="36" ry="22" fill="#8f332b" transform="rotate(-22)"/><ellipse class="bloom" rx="19" ry="33" fill="#ba5c4d" transform="rotate(18)"/><path class="line faint spinA" d="M-28-7A29 29 0 1 1 26-10"/><path class="line spinB" d="M-17-24A29 29 0 0 1 28 8"/><path class="line bold" d="M-39 0H39"/><path class="line" d="M0-36V36"/><path class="line faint" d="M-25-25L-8-8 M10 10L28 28 M-24 24L-8 8 M8-8L25-25"/><circle class="node floatB" cx="-25" cy="0" r="2" fill="#bd7159"/><circle class="node floatA" cx="26" cy="-10" r="2" fill="#bd7159"/><circle class="node floatB" cx="0" cy="25" r="2" fill="#bd7159"/><circle class="core" r="4.4" fill="#e79b80"/><path class="starburst" stroke="#efad94" d="M0-13L3-3L13 0L3 3L0 13L-3 3L-13 0L-3-3Z"/><text x="18" y="40">RED GLASS RELIQUARY</text></g>
</g></svg>
<div class="hint">Drag to pan · scroll to zoom · select a delve to align the chart</div>
</section>
<aside class="dossier" id="dossier" aria-live="polite" aria-hidden="true"><button class="close-dossier" id="closeDossier" type="button" aria-label="Close delve details">×</button>
<svg class="bird" viewBox="0 0 90 90" aria-hidden="true"><path d="M15 52C29 46 37 28 54 25C64 23 69 28 76 25C71 33 66 37 60 39C67 41 72 46 74 54C65 50 57 49 51 52C42 57 38 67 29 71C31 62 28 57 15 52Z" fill="none" stroke="#b9a36e" stroke-width="2"/><circle cx="60" cy="32" r="2" fill="#cfbc84"/><path d="M27 70L21 80M33 68L31 81" stroke="#8d7a4e" stroke-width="1.5"/></svg>
<div class="chapter" id="chapter"></div><h2 id="name"></h2><div class="chips" id="chips"></div><p class="lede" id="lede"></p><div class="rule">Known particulars</div><dl><dt>System</dt><dd id="system"></dd><dt>Sponsor</dt><dd id="sponsor"></dd><dt>Signal</dt><dd id="signal"></dd><dt>Risk</dt><dd id="risk"></dd><dt>Return</dt><dd id="return"></dd></dl><div class="rumor" id="rumor"></div>
</aside></div>
<div class="legend"><span><i class="dot blue"></i>Home / known space</span><span><i class="dot"></i>Confirmed delve</span><span><i class="dot red"></i>Rumored / unstable site</span></div>
</main>
<script>
(()=>{
const root=document.getElementById("app"), chart=document.querySelector(".chart"), svg=document.getElementById("map"), route=document.getElementById("activeRoute"), dossier=document.getElementById("dossier");
const motion=!matchMedia("(prefers-reduced-motion: reduce)").matches;root.classList.toggle("motion",motion);
const info={
choir:{chapter:"Expedition prospect · 01",name:"The Choir Below",chips:["Confirmed ruin","Builder origin","Guild interest"],lede:"A buried complex answers long-range scans with a repeating harmonic pulse. The pattern is too precise to be geological and too old to belong to the Diaspora.",system:"Hesentau drift",sponsor:"Explorers Guild",signal:"Seven-note repeating carrier",risk:"Moderate · structural unknowns",ret:"Artifacts · cartographic priority",rumor:"“The first survey team said the stone was singing back to their Bird.”",route:"M205 372 C310 322 380 286 514 238",view:[320,78,430,330]},
feathers:{chapter:"Expedition prospect · 02",name:"Vault of Seven Feathers",chips:["Confirmed ruin","Bird resonance","Unclaimed"],lede:"Seven black spires surround a narrow fissure in the moon’s crust. Garuda activity increases sharply whenever a vessel crosses the inner ring.",system:"Ninhulam outer moon",sponsor:"Open claim",signal:"Intermittent Garuda resonance",risk:"High · unknown fauna",ret:"Glyphs · probable intact archive",rumor:"“Every crew sees a different seventh tower. The Bird always sees the same one.”",route:"M205 372 C330 382 510 404 676 350",view:[465,175,430,330]},
reliquary:{chapter:"Expedition prospect · 03",name:"Red Glass Reliquary",chips:["Rumored","Blight suspected","Restricted"],lede:"A fragmentary chart recovered from a wreck marks a chamber beneath a red-glass plateau. No expedition has yet verified that the site exists.",system:"Uncatalogued body",sponsor:"None",signal:"No direct contact",risk:"Severe · Blight indicators",ret:"Unknown",rumor:"“Do not follow the red reflection. The real entrance casts no light.”",route:"M205 372 C274 445 405 494 560 474",view:[350,285,430,330]}
};
const $=id=>document.getElementById(id);
const defaultView=[0,0,900,600], minW=250, maxW=1800;
let view=defaultView.slice(), target=view.slice(), raf=0, dragging=false, pointerId=null, lastX=0,lastY=0,moved=false;

function setView(v){view=v;svg.setAttribute("viewBox",view.join(" "))}
function animateTo(v){target=v.slice();cancelAnimationFrame(raf);if(!motion){setView(target.slice());return}const step=()=>{let done=true;const next=view.slice();for(let i=0;i<4;i++){const d=target[i]-view[i];if(Math.abs(d)>.12){next[i]=view[i]+d*.1;done=false}else next[i]=target[i]}setView(next);if(!done)raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)}
function openDossier(key){
 const d=info[key]; if(!d)return;
 $("chapter").textContent=d.chapter;$("name").textContent=d.name;$("lede").textContent=d.lede;$("system").textContent=d.system;$("sponsor").textContent=d.sponsor;$("signal").textContent=d.signal;$("risk").textContent=d.risk;$("return").textContent=d.ret;$("rumor").textContent=d.rumor;
 $("chips").replaceChildren(...d.chips.map(x=>{const s=document.createElement("span");s.className="chip";s.textContent=x;return s}));
 route.setAttribute("d",d.route);route.style.opacity="1";
 document.querySelectorAll(".system").forEach(n=>n.classList.toggle("selected",n.dataset.key===key));
 dossier.classList.add("open");dossier.setAttribute("aria-hidden","false");
 animateTo(d.view);
}
function closeDossier(){
 dossier.classList.remove("open");dossier.setAttribute("aria-hidden","true");route.style.opacity="0";
 document.querySelectorAll(".system").forEach(n=>n.classList.remove("selected"));
}
document.querySelectorAll(".system").forEach(n=>{
 const go=()=>{if(n.dataset.key==="home"){closeDossier();animateTo(defaultView)}else openDossier(n.dataset.key)};
 n.addEventListener("click",e=>{if(!moved)go()});
 n.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}});
});
$("closeDossier").addEventListener("click",closeDossier);
$("reset").addEventListener("click",()=>{closeDossier();animateTo(defaultView)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDossier()});

svg.addEventListener("pointerdown",e=>{
 if(e.button!==0||e.target.closest(".system"))return;
 cancelAnimationFrame(raf);dragging=true;moved=false;pointerId=e.pointerId;lastX=e.clientX;lastY=e.clientY;chart.classList.add("dragging");svg.setPointerCapture(pointerId);
});
svg.addEventListener("pointermove",e=>{
 if(!dragging||e.pointerId!==pointerId)return;
 const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;
 const r=svg.getBoundingClientRect();const unitsPerPx=Math.min(view[2]/r.width,view[3]/r.height);
 setView([view[0]-dx*unitsPerPx,view[1]-dy*unitsPerPx,view[2],view[3]]);
 lastX=e.clientX;lastY=e.clientY;
});
function endDrag(e){if(!dragging||(e&&e.pointerId!==pointerId))return;dragging=false;pointerId=null;chart.classList.remove("dragging")}
svg.addEventListener("pointerup",endDrag);svg.addEventListener("pointercancel",endDrag);

svg.addEventListener("wheel",e=>{
 e.preventDefault();cancelAnimationFrame(raf);
 const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
 const matrix=svg.getScreenCTM();if(!matrix)return;
 const before=pt.matrixTransform(matrix.inverse());
 const factor=Math.exp(e.deltaY*0.0012);
 let newW=Math.max(minW,Math.min(maxW,view[2]*factor));
 const scale=newW/view[2],newH=view[3]*scale;
 const nx=before.x-(before.x-view[0])*scale, ny=before.y-(before.y-view[1])*scale;
 setView([nx,ny,newW,newH]);
},{passive:false});

route.style.opacity="0";
setView(defaultView);

const canvas=$("dust"),ctx=canvas.getContext("2d");let particles=[];
function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);particles=Array.from({length:110},()=>({x:Math.random()*r.width,y:Math.random()*r.height,r:.3+Math.random()*1.1,vx:(Math.random()-.5)*.045,vy:.025+Math.random()*.075,a:.12+Math.random()*.32}))}
function dust(){const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);particles.forEach(q=>{if(motion){q.x+=q.vx;q.y+=q.vy;if(q.y>r.height+3)q.y=-3;if(q.x<-3)q.x=r.width+3;if(q.x>r.width+3)q.x=-3}ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fillStyle=`rgba(214,204,171,${q.a})`;ctx.fill()});requestAnimationFrame(dust)}
resize();dust();new ResizeObserver(resize).observe(chart);
})();
</script>
</body>
</html>
